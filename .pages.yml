# Pages CMS configuration (https://pagescms.org). Generated by scripts/cms/build-config.py:
# edit the spec there, then run: python3 scripts/cms/build-config.py && python3 scripts/cms/check.py
media:
  input: src/assets/media
  output: /media
  categories:
  - image
content:
- name: settings
  label: Ustawienia i kontakt
  type: file
  path: content/site.json
  format: json
  description: Dane kontaktowe, formularz, kalendarz, analityka.
  fields:
  - name: name
    label: Imię i nazwisko
    type: string
    required: true
    description: Pojawia się w menu, stopce, tytułach stron i danych strukturalnych.
  - name: email
    label: E-mail kontaktowy
    type: string
    required: true
    description: Adres w stopce, formularzu i polityce prywatności.
  - name: linkedin
    label: Profil LinkedIn
    type: string
    description: Pełny adres, np. https://www.linkedin.com/in/… Puste = ukryty. Trafia też do schema (sameAs).
  - name: photo
    label: Zdjęcie
    type: image
    description: 'Portret: pokazuje się w sekcji Doświadczenie, przy formularzu kontaktowym i w „Dlaczego ja” na podstronach usług, trafia też do schema. Najlepiej min. 1000×1000 px, twarz w górnej części
      kadru. Strona sama przytnie i odchudzi plik.'
  - name: formEndpoint
    label: Adres formularza (Formspree / Web3Forms)
    type: string
    description: Np. https://formspree.io/f/xxxx albo https://api.web3forms.com/submit. Puste = formularz otwiera program pocztowy.
  - name: formAccessKey
    label: Klucz Web3Forms
    type: string
    description: Tylko dla Web3Forms. Dla Formspree zostaw puste.
  - name: bookingUrl
    label: Link do kalendarza
    type: string
    description: Cal.com albo Calendly. Gdy jest ustawiony, przy formularzu pojawia się „Wolisz od razu wybrać termin?”.
  - name: gtmId
    label: Google Tag Manager ID
    type: string
    description: Np. GTM-XXXXXXX. Puste = brak analityki, brak banera cookies.
- name: pages
  label: Strona główna
  type: group
  items:
  - name: pl
    label: Po polsku
    type: file
    path: content/pl.json
    format: json
    fields:
    - name: meta
      label: SEO strony głównej
      type: object
      fields:
      - name: title
        label: Tytuł (title)
        type: string
        description: Do 60 znaków. Widoczny w Google i na karcie przeglądarki.
      - name: description
        label: Opis (meta description)
        type: text
        description: Do 155 znaków. Widoczny pod tytułem w Google.
    - name: hero
      label: Hero (pierwszy ekran)
      type: object
      fields:
      - name: pill
        label: Linijka nad nagłówkiem
        type: string
      - name: titleA
        label: Nagłówek, linia 1
        type: string
      - name: titleB
        label: Nagłówek, linia 2 (kolorowa)
        type: string
      - name: lead
        label: Tekst pod nagłówkiem
        type: text
      - name: ctaPrimary
        label: Przycisk główny
        type: string
      - name: ctaSecondary
        label: Link obok przycisku
        type: string
      - name: ctaNote
        label: Dopisek pod przyciskiem
        type: string
      - name: trustLabel
        label: Podpis przed nazwami firm
        type: string
      - name: demo
