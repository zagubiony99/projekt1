          type: string
        - name: think
          label: Komunikat „szukam”
          type: string
        - name: answer
          label: Odpowiedź
          type: text
          description: 'Przypisy wpisuj jako [1], [2], [3]: numer = pozycja na liście źródeł.'
        - name: sourcesLabel
          label: Nagłówek listy źródeł
          type: string
        - name: sources
          label: Źródła
          type: object
          fields:
          - name: d
            label: Domena
            type: string
          - name: t
            label: Tytuł strony
            type: string
          - name: you
