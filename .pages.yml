          type: object
          fields:
          - name: bot
            label: Nazwa bota
            type: string
          - name: s
            label: Status
            type: select
            options:
              values:
              - value: ok
                label: OK (zielony)
              - value: warn
                label: Uwaga (pomarańczowy)
              - value: err
                label: Błąd (czerwony)
          - name: t
            label: Opis
            type: string
          list: true
