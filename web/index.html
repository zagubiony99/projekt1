<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oncrawl API Explorer</title>
<link href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet" />
<style>
  :root { --bg:#0f1420; --panel:#171d2b; --line:#28324a; --fg:#e6ebf5; --muted:#8a97b1; --accent:#4c8bf5; --accent2:#2ecc71; --danger:#e05260; }
  * { box-sizing:border-box; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { margin:0; font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600; white-space:nowrap; }
  select, input, button { background:#0d1220; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ok { background:var(--accent2); border-color:var(--accent2); color:#04210f; }
  button.link { background:none; border:none; color:var(--muted); padding:2px 4px; }
  .tabs { display:flex; gap:4px; padding:8px 16px 0; background:var(--panel); flex-wrap:wrap; max-width:100%; }
  header { flex-wrap:wrap; }
  .tab { padding:8px 14px; border:1px solid var(--line); border-bottom:none; border-radius:8px 8px 0 0; background:#0d1220; color:var(--muted); cursor:pointer; }
  .tab.active { background:var(--bg); color:var(--fg); font-weight:600; }
  .tab.disabled { opacity:.35; cursor:not-allowed; }
  /* minmax(0,1fr) jest kluczowe: bez tego szeroka tabela rozpycha całą stronę
     w poziomie i sidebar/zakładki uciekają poza ekran. */
  .wrap { display:grid; grid-template-columns:320px minmax(0,1fr); height:calc(100vh - 108px); overflow:hidden; }
  aside { border-right:1px solid var(--line); padding:12px; overflow-y:auto; overflow-x:hidden; background:var(--panel); }
  main { display:flex; flex-direction:column; min-width:0; overflow:hidden; }
  .toolbar { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; flex:0 0 auto; }
  .toolbar .grow { flex:1; }
  #quickViews { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #quickViews button { font-size:12px; padding:5px 9px; }
  #table { flex:1 1 auto; min-height:0; min-width:0; overflow:hidden; }
  .section { margin-bottom:18px; }
  .section h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px; }
  .search { width:100%; margin-bottom:8px; }
  .filter-row { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; background:#0d1220; }
  .filter-row .fname { font-weight:600; font-size:13px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .filter-row .fname .ftype { color:var(--muted); font-weight:400; font-size:11px; }
  .filter-row .controls { display:flex; gap:6px; flex-wrap:wrap; }
  .filter-row input, .filter-row select { flex:1; min-width:70px; }
  .cols label { display:block; padding:2px 0; font-size:13px; cursor:pointer; }
  .cols label .ftype { color:var(--muted); font-size:11px; }
  .muted { color:var(--muted); }
  .pill { background:#0d1220; border:1px solid var(--line); border-radius:20px; padding:3px 10px; font-size:12px; white-space:nowrap; }
  #presetList { display:flex; flex-direction:column; gap:4px; }
  #presetList .p { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .banner { background:#3a2417; border:1px solid #7a4a26; color:#f0c088; padding:8px 16px; font-size:13px; display:none; }
  .banner.show { display:block; }
  .count { font-size:11px; color:var(--muted); margin-bottom:6px; }
  .tabulator { background:var(--bg); border:none; font-size:13px; max-width:100%; }
  .tabulator .tabulator-row { background:var(--panel); color:var(--fg); border-color:var(--line); }
  /* Nagłówki: jaśniejsze tło + wymuszony kolor tekstu (domyślny Tabulatora
     jest ciemny i na ciemnym motywie znika). */
  .tabulator .tabulator-header { background:#1e2740 !important; border-bottom:2px solid var(--line); }
  .tabulator .tabulator-header .tabulator-col { background:#1e2740 !important; border-right:1px solid var(--line); }
  .tabulator .tabulator-header .tabulator-col .tabulator-col-title {
    color:#ffffff !important; font-weight:600; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .tabulator .tabulator-header .tabulator-col:hover { background:#28324a !important; }
  .tabulator .tabulator-cell { border-color:var(--line); color:var(--fg); }
  .tabulator-row .tabulator-cell.tabulator-frozen,
  .tabulator .tabulator-header .tabulator-col.tabulator-frozen { background:#0d1220 !important; border-right:2px solid var(--accent); }
  .tabulator-row.tabulator-row-even { background:#131a28; }
  .tabulator .tabulator-tableholder { background:var(--bg); }
  .tabulator .tabulator-col.sortable .tabulator-col-title { cursor:pointer; }
  .tabulator .tabulator-col.sortable:hover { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🕷️ Oncrawl API Explorer</h1>
  <label>Project <select id="projectSel"></select></label>
  <label id="crawlWrap">Crawl <select id="crawlSel"></select></label>
  <span class="grow" style="flex:1"></span>
</header>

<div id="banner" class="banner"></div>
<div class="tabs" id="tabs"></div>

<div class="wrap">
  <aside>
    <div class="section">
      <h3>Columns</h3>
      <input id="colSearch" class="search" placeholder="filter fields…" oninput="app.filterList('cols', this.value)" />
      <div style="display:flex; gap:6px; margin-bottom:6px;">
        <button class="link" onclick="app.allColumns(true)">select all</button>
        <button class="link" onclick="app.allColumns(false)">clear</button>
      </div>
      <div id="colCount" class="count"></div>
      <div id="cols" class="cols"></div>
    </div>
    <div class="section">
      <h3>Filters → OQL</h3>
      <input id="filterSearch" class="search" placeholder="filter fields…" oninput="app.filterList('filters', this.value)" />
      <div id="filters"></div>
    </div>
    <div class="section">
      <h3>Saved presets</h3>
      <div style="display:flex; gap:6px; margin-bottom:6px;">
        <input id="presetName" placeholder="preset name" style="flex:1" />
        <button onclick="app.savePreset()">💾</button>
      </div>
      <div id="presetList"></div>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <button class="primary" onclick="app.run()">▶ Run</button>
      <input id="urlSearch" placeholder="🔎 search in URLs…" style="width:200px"
             title="Filters rows where the URL contains this text (case-insensitive)"
             onkeydown="if(event.key==='Enter'){app.page=0;app.run();}" />
      <span id="quickViews"></span>
      <span class="grow"></span>
      <span class="pill" id="totalHits">—</span>
      <button onclick="app.prevPage()" title="previous page">◀</button>
      <span id="pageInfo" class="muted">1</span>
      <button onclick="app.nextPage()" title="next page">▶</button>
      <label class="muted">rows
        <select id="pageSize" onchange="app.setPageSize(this.value)">
          <option>50</option><option selected>100</option><option>250</option><option>500</option>
        </select>
      </label>
      <span style="width:12px"></span>
      <button class="ok" onclick="app.export('csv')">⬇ CSV</button>
      <button class="ok" onclick="app.export('xlsx')">⬇ XLSX</button>
    </div>
    <div id="table"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<script>
const DATA_TYPES = ["pages","links","clusters","structured_data","logs","ranking_performance"];
const NEEDS_CRAWL = new Set(["pages","links","clusters","structured_data"]);
const NUMERIC_TYPES = new Set(["int","integer","natural","long","float","double","decimal","number","percentage"]);
const DATE_TYPES = new Set(["date","datetime"]);
const BOOL_TYPES = new Set(["bool","boolean"]);

// Gotowe widoki SEO. Każdy deklaruje wymagane pola — pokazujemy tylko te,
// które faktycznie istnieją w schemacie danego data_type (z /fields).
const QUICK_VIEWS = [
  { label:"Fetched only", needs:["fetched"],
    oql:()=>({field:["fetched","equals",true]}),
    cols:["url","status_code","title","depth","inrank","word_count"] },
  { label:"Errors 4xx/5xx", needs:["status_code"],
    oql:()=>({field:["status_code","gte",400]}),
    cols:["url","status_code","depth","nb_inlinks"], sort:"status_code:desc" },
  { label:"Redirects 3xx", needs:["status_code"],
    oql:()=>({and:[{field:["status_code","gte",300]},{field:["status_code","lt",400]}]}),
    cols:["url","status_code","redirect_location","depth"] },
  { label:"Non-indexable", needs:["indexable"],
    oql:()=>({field:["indexable","has_value"]}),
    cols:["url","indexable","status_code","meta_robots","rel_canonical"] },
  { label:"Slow pages", needs:["load_time"],
    oql:()=>({field:["load_time","gte",1000]}),
    cols:["url","load_time","status_code","weight"], sort:"load_time:desc" },
  { label:"Thin content", needs:["word_count"],
    oql:()=>({field:["word_count","lt",300]}),
    cols:["url","word_count","title","status_code"], sort:"word_count:asc" },
  { label:"Bot hits", needs:["event_bot_kind"],
    oql:()=>({field:["event_is_bot_hit","equals",true]}),
    cols:["event_url","event_bot_name","event_bot_kind","event_status_code","event_day"] },
];

const app = {
  projects: [], project: null, crawls: [], crawlId: null,
  dataType: null, schema: [], selected: new Set(),
  sort: null, // {field, dir}
  page: 0, pageSize: 100, total: 0, table: null,

  async init() {
    const r = await fetch("/api/projects").then(x=>x.json()).catch(()=>null);
    if (!r) { this.banner("Could not load /api/projects. Is the backend running and capabilities.json present?"); return; }
    this.projects = r.projects || [];
    const sel = document.getElementById("projectSel");
    sel.innerHTML = this.projects.map(p =>
      `<option value="${p.id}">${escapeHtml(p.name||p.id)}${p.error?" ⛔":""}</option>`).join("");
    sel.onchange = () => this.selectProject(sel.value);
    document.getElementById("pageSize").value = this.pageSize;
    await this.loadPresets();
    if (this.projects.length) await this.selectProject(this.projects[0].id);
  },

  banner(msg) {
    const b = document.getElementById("banner");
    b.textContent = msg || ""; b.classList.toggle("show", !!msg);
  },

  async selectProject(pid) {
    this.project = this.projects.find(p=>p.id===pid);
    this.banner(this.project && this.project.error ? `Project: ${this.project.error}` : "");
    const cr = await fetch(`/api/projects/${pid}/crawls`).then(x=>x.json()).catch(()=>({crawls:[]}));
    this.crawls = cr.crawls || [];
    const csel = document.getElementById("crawlSel");
    csel.innerHTML = this.crawls.map(c =>
      `<option value="${c.id}">${c.id}${c.status?" · "+c.status:""}${c.end_reason?" / "+c.end_reason:""}</option>`).join("");
    this.crawlId = cr.last_finished_crawl_id || (this.crawls[0]||{}).id || null;
    if (this.crawlId) csel.value = this.crawlId;
    csel.onchange = () => { this.crawlId = csel.value; this.run(); };
    this.renderTabs();
    const avail = this.project.available_data_types || {};
    const first = DATA_TYPES.find(dt => avail[dt]);
    if (first) await this.selectDataType(first);
  },

  renderTabs() {
    const avail = (this.project||{}).available_data_types || {};
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = DATA_TYPES.map(dt => {
      const on = !!avail[dt];
      const cls = "tab" + (dt===this.dataType?" active":"") + (on?"":" disabled");
      return `<div class="${cls}" ${on?`onclick="app.selectDataType('${dt}')"`:""}>${dt}${on?"":" ⛔"}</div>`;
    }).join("");
    document.getElementById("crawlWrap").style.display = NEEDS_CRAWL.has(this.dataType) ? "" : "none";
  },

  async selectDataType(dt) {
    this.dataType = dt; this.sort = null; this.page = 0;
    this.renderTabs();
    const r = await fetch(`/api/fields?project_id=${this.project.id}&data_type=${dt}`).then(x=>x.json());
    this.schema = r.fields || [];
    this.selected = new Set(r.default_display || this.schema.filter(f=>f.can_display).slice(0,12).map(f=>f.name));
    this.renderColumns(); this.renderFilters(); this.renderQuickViews();
    await this.run();
  },

  renderQuickViews() {
    const names = new Set(this.schema.map(f=>f.name));
    const usable = QUICK_VIEWS.filter(v => v.needs.every(n => names.has(n)));
    document.getElementById("quickViews").innerHTML = usable.length
      ? '<span class="muted" style="margin:0 6px">views:</span>' + usable.map((v,i) =>
          `<button onclick="app.applyQuickView(${QUICK_VIEWS.indexOf(v)})">${escapeHtml(v.label)}</button>`).join(" ")
      : "";
  },

  applyQuickView(idx) {
    const v = QUICK_VIEWS[idx]; if (!v) return;
    const names = new Set(this.schema.map(f=>f.name));
    // Kolumny widoku + pozostaw tylko istniejące w tym data_type.
    const cols = v.cols.filter(c => names.has(c));
    if (cols.length) { this.selected = new Set(cols); this.renderColumns(); }
    this.pendingOQL = v.oql();       // omija panel filtrów — ustawiamy OQL wprost
    this.sort = null;
    if (v.sort) { const [f,d] = v.sort.split(":"); if (names.has(f)) this.sort = {field:f, dir:d}; }
    this.page = 0;
    this.run();
  },

  renderColumns() {
    const box = document.getElementById("cols");
    const displayable = this.schema.filter(f=>f.can_display);
    document.getElementById("colCount").textContent = `${displayable.length} fields · ${this.selected.size} shown`;
    box.innerHTML = displayable.map(f =>
      `<label data-fname="${escapeHtml(f.name.toLowerCase())}"><input type="checkbox" ${this.selected.has(f.name)?"checked":""}
         onchange="app.toggleColumn('${escapeAttr(f.name)}',this.checked)"> ${escapeHtml(f.name)}
         <span class="ftype">${f.type||""}</span></label>`).join("");
  },
  toggleColumn(name, on) {
    on ? this.selected.add(name) : this.selected.delete(name);
    document.getElementById("colCount").textContent =
      `${this.schema.filter(f=>f.can_display).length} fields · ${this.selected.size} shown`;
  },
  allColumns(on) {
    this.selected = new Set(on ? this.schema.filter(f=>f.can_display).map(f=>f.name) : []);
    this.renderColumns();
  },

  renderFilters() {
    const box = document.getElementById("filters");
    box.innerHTML = this.schema.filter(f=>f.can_filter).map(f => this.filterControl(f)).join("");
    // Ręczne dotknięcie filtra unieważnia szybki widok.
    box.oninput = () => { this.pendingOQL = null; };
  },

  filterControl(f) {
    const t = (f.type||"string").toLowerCase();
    const hasEnum = Array.isArray(f.values) && f.values.length;
    let controls = "";
    if (hasEnum) {
      const opts = f.values.map(v=>`<option value="${escapeHtml(String(v))}">${escapeHtml(String(v))}</option>`).join("");
      controls = `<select multiple size="${Math.min(4,f.values.length)}" data-role="enum" data-field="${escapeAttr(f.name)}" style="flex:1">${opts}</select>`;
    } else if (NUMERIC_TYPES.has(t)) {
      controls = `<input type="number" step="any" placeholder="min" data-role="min" data-field="${escapeAttr(f.name)}">
                  <input type="number" step="any" placeholder="max" data-role="max" data-field="${escapeAttr(f.name)}">`;
    } else if (BOOL_TYPES.has(t)) {
      controls = `<select data-role="bool" data-field="${escapeAttr(f.name)}"><option value="">(any)</option>
                  <option value="true">true</option><option value="false">false</option></select>`;
    } else if (DATE_TYPES.has(t)) {
      controls = `<input type="date" data-role="dmin" data-field="${escapeAttr(f.name)}">
                  <input type="date" data-role="dmax" data-field="${escapeAttr(f.name)}">`;
    } else {
      controls = `<select data-role="op" data-field="${escapeAttr(f.name)}">
                    <option value="contains">contains</option><option value="equals">equals</option>
                    <option value="startswith">starts with</option><option value="endswith">ends with</option>
                    <option value="has_value">has value</option><option value="has_no_value">no value</option>
                  </select>
                  <input type="text" placeholder="value" data-role="val" data-field="${escapeAttr(f.name)}">
                  <label class="muted" style="font-size:11px"><input type="checkbox" data-role="ci" data-field="${escapeAttr(f.name)}"> ci</label>`;
    }
    return `<div class="filter-row" data-fname="${escapeHtml(f.name.toLowerCase())}">
      <div class="fname">${escapeHtml(f.name)} <span class="ftype">${f.type||""}</span></div>
      <div class="controls">${controls}</div></div>`;
  },

  filterList(which, term) {
    term = (term||"").toLowerCase();
    const sel = which === "cols" ? "#cols label" : "#filters .filter-row";
    document.querySelectorAll(sel).forEach(el => {
      const name = el.getAttribute("data-fname") || "";
      el.style.display = name.includes(term) ? "" : "none";
    });
  },

  buildOQL() {
    const leaves = [];
    const q = sel => Array.from(document.querySelectorAll(sel));
    q('[data-role="op"]').forEach(op => {
      const field = op.dataset.field, o = op.value;
      const val = document.querySelector(`[data-role="val"][data-field="${cssEsc(field)}"]`);
      const ci = document.querySelector(`[data-role="ci"][data-field="${cssEsc(field)}"]`);
      if (o==="has_value"||o==="has_no_value") { leaves.push({field:[field,o]}); return; }
      if (val && val.value!=="") {
        const leaf=[field,o,val.value]; if (ci && ci.checked) leaf.push({ci:true});
        leaves.push({field:leaf});
      }
    });
    q('[data-role="min"]').forEach(min => {
      const field=min.dataset.field;
      const max=document.querySelector(`[data-role="max"][data-field="${cssEsc(field)}"]`);
      if (min.value!=="" && max && max.value!=="") leaves.push({field:[field,"between",[num(min.value),num(max.value)]]});
      else if (min.value!=="") leaves.push({field:[field,"gte",num(min.value)]});
      else if (max && max.value!=="") leaves.push({field:[field,"lte",num(max.value)]});
    });
    q('[data-role="dmin"]').forEach(min => {
      const field=min.dataset.field;
      const max=document.querySelector(`[data-role="dmax"][data-field="${cssEsc(field)}"]`);
      if (min.value) leaves.push({field:[field,"gte",min.value]});
      if (max && max.value) leaves.push({field:[field,"lte",max.value]});
    });
    q('[data-role="bool"]').forEach(b => {
      if (b.value!=="") leaves.push({field:[b.dataset.field,"equals",b.value==="true"]});
    });
    q('[data-role="enum"]').forEach(en => {
      const chosen=Array.from(en.selectedOptions).map(o=>o.value);
      if (chosen.length===1) leaves.push({field:[en.dataset.field,"equals",coerce(chosen[0])]});
      else if (chosen.length>1) leaves.push({or:chosen.map(v=>({field:[en.dataset.field,"equals",coerce(v)]}))});
    });
    if (!leaves.length) return null;
    if (leaves.length===1) return leaves[0];
    return {and:leaves};
  },

  // Szybka szukajka w pasku: url/event_url contains (case-insensitive).
  urlSearchLeaf() {
    const el = document.getElementById("urlSearch");
    const term = el && el.value.trim();
    if (!term) return null;
    const names = new Set(this.schema.map(f=>f.name));
    const field = names.has("url") ? "url" : (names.has("event_url") ? "event_url" : null);
    if (!field) return null;
    return {field:[field, "contains", term, {ci:true}]};
  },

  currentQuery(extra={}) {
    // Filtry z panelu mają pierwszeństwo; pendingOQL to szybki widok.
    const panelOQL = this.buildOQL();
    let oql = panelOQL || this.pendingOQL || null;
    // Szukajka URL łączy się (AND) z tym, co już jest.
    const search = this.urlSearchLeaf();
    if (search) oql = oql ? {and:[oql, search]} : search;
    return Object.assign({
      project_id:this.project.id, data_type:this.dataType,
      crawl_id: NEEDS_CRAWL.has(this.dataType)?this.crawlId:null,
      fields:Array.from(this.selected), oql,
      sort:this.sort?`${this.sort.field}:${this.sort.dir}`:null,
    }, extra);
  },

  async run() {
    if (!this.project || !this.dataType) return;
    if (!this.selected.size) { this.banner("Select at least one column."); return; }
    if (NEEDS_CRAWL.has(this.dataType) && !this.crawlId) { this.banner("Select a crawl."); return; }
    const body = this.currentQuery({limit:this.pageSize, offset:this.page*this.pageSize});
    let res;
    try { res = await postJSON("/api/query", body); }
    catch(e) { this.banner("Query failed: "+e.message); return; }
    this.banner("");
    this.total = res.total_hits ?? 0;
    document.getElementById("totalHits").textContent = `${this.total.toLocaleString()} results`;
    document.getElementById("pageInfo").textContent =
      `${this.page+1} / ${Math.max(1,Math.ceil(Math.min(this.total,10000)/this.pageSize))}`;
    this.renderTable(res.rows||[]);
  },

  renderTable(rows) {
    const cols = Array.from(this.selected).map(name => {
      const isUrl = name === "url" || name === "event_url";
      return {
        title:name + (this.sort&&this.sort.field===name?(this.sort.dir==="asc"?" ▲":" ▼"):""),
        field:name, headerSort:false, cssClass:"sortable",
        headerClick:(e,col)=>this.toggleSort(col.getField()),
        frozen:isUrl, width:isUrl?340:undefined,
        minWidth:90, maxInitialWidth:isUrl?340:260, resizable:true,
        formatter:(cell)=>{ const v=cell.getValue(); return v===null||v===undefined?"":escapeHtml(String(v)); },
      };
    });
    if (this.table) { this.table.destroy(); }
    this.table = new Tabulator("#table", {
      data:rows, columns:cols, layout:"fitData", height:"100%",
      movableColumns:true, resizableColumns:true,
      placeholder:"No rows (adjust filters or columns).",
    });
    this.maybeEmptyHint(rows);
  },

  // Gdy wszystkie metryki poza URL są puste, to zwykle niepobrane URL-e —
  // podpowiedz sortowanie/filtr zamiast zostawiać użytkownika z pustą tabelą.
  maybeEmptyHint(rows) {
    if (!rows.length) return;
    const metricCols = Array.from(this.selected).filter(n => n!=="url" && n!=="event_url");
    if (!metricCols.length) return;
    const allEmpty = rows.every(r => metricCols.every(c => r[c]===null || r[c]===undefined || r[c]===""));
    if (allEmpty) {
      const sortable = this.schema.find(f=>["fetched","status_code","depth","inrank"].includes(f.name) && f.can_sort);
      const tip = sortable ? ` Click the "${sortable.name}" header to sort, or add a filter (e.g. fetched = true).` : "";
      this.banner("These URLs have no crawl metrics (likely non-fetched / 404 URLs)." + tip);
    }
  },

  toggleSort(field) {
    const f = this.schema.find(x=>x.name===field);
    if (!f || !f.can_sort) { this.banner(`Field "${field}" is not sortable.`); return; }
    if (this.sort && this.sort.field===field) this.sort.dir = this.sort.dir==="asc"?"desc":"asc";
    else this.sort = {field, dir:"asc"};
    this.page = 0; this.run();
  },

  setPageSize(v){ this.pageSize=+v; this.page=0; this.run(); },
  nextPage(){ if ((this.page+1)*this.pageSize < Math.min(this.total,10000)) { this.page++; this.run(); } },
  prevPage(){ if (this.page>0){ this.page--; this.run(); } },

  async export(fileType) {
    const body = this.currentQuery({file_type:fileType});
    this.banner("Exporting…");
    const res = await fetch("/api/export",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if (!res.ok) { this.banner("Export failed: "+res.status); return; }
    this.banner("");
    const blob = await res.blob();
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`${this.dataType}.${fileType}`; a.click(); URL.revokeObjectURL(a.href);
  },

  // --- presets ---
  async loadPresets(){
    const r = await fetch("/api/presets").then(x=>x.json()).catch(()=>({presets:[]}));
    this.renderPresets(r.presets||[]);
  },
  renderPresets(presets){
    const box=document.getElementById("presetList");
    box.innerHTML = presets.map(p=>`<div class="p"><button class="link" onclick='app.applyPreset(${escapeAttr(JSON.stringify(p.query))})'>▷ ${escapeHtml(p.name)}</button>
      <button class="link" style="color:var(--danger)" onclick="app.deletePreset('${escapeAttr(p.name)}')">✕</button></div>`).join("")
      || '<span class="muted">none</span>';
  },
  async savePreset(){
    const name=document.getElementById("presetName").value.trim(); if(!name) return;
    const query=this.currentQuery({page:this.page,pageSize:this.pageSize});
    const r=await postJSON("/api/presets",{name,query}); this.renderPresets(r.presets);
    document.getElementById("presetName").value="";
  },
  async deletePreset(name){
    const r=await fetch("/api/presets/"+encodeURIComponent(name),{method:"DELETE"}).then(x=>x.json());
    this.renderPresets(r.presets);
  },
  async applyPreset(q){
    document.getElementById("projectSel").value=q.project_id;
    await this.selectProject(q.project_id);
    if (q.crawl_id){ this.crawlId=q.crawl_id; document.getElementById("crawlSel").value=q.crawl_id; }
    await this.selectDataType(q.data_type);
    if (q.fields){ this.selected=new Set(q.fields); this.renderColumns(); }
    if (q.pageSize){ this.pageSize=q.pageSize; document.getElementById("pageSize").value=q.pageSize; }
    if (q.sort){ const [f,d]=q.sort.split(":"); this.sort={field:f,dir:d||"asc"}; }
    this.run();
  },
};

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }
function num(v){ const n=Number(v); return Number.isNaN(n)?v:n; }
function coerce(v){ if(v==="true")return true; if(v==="false")return false; const n=Number(v); return (v!==""&&!Number.isNaN(n))?n:v; }
async function postJSON(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){
    // Backend zwraca {detail, type, code, fields} — pokaż powód, nie "500".
    let msg = `HTTP ${r.status}`;
    try {
      const j = await r.json();
      if (j.detail) msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail);
      if (j.fields) msg += ` — fields: ${JSON.stringify(j.fields)}`;
    } catch(e) { try { msg = (await r.text()) || msg; } catch(_) {} }
    throw new Error(msg);
  }
  return r.json();
}
app.init();
</script>
